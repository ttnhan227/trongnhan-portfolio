    <path d="M 0 4 Q 0 2 2 2 L 18 2 Q 20 2 20 4 L 20 6 Q 20 8 18 8 L 12 8 L 12 28 Q 12 30 10 30 L 8 30 Q 6 30 6 28 L 6 8 L 2 8 Q 0 8 0 6 Z" fill="url(#brandGrad)" />
    
    <!-- N Letter -->
    <path d="M 23 28 L 23 4 Q 23 2 25 2 L 28 2 Q 29.5 2 30.5 3.2 L 37.5 17.5 L 37.5 4 Q 37.5 2 39.5 2 L 41 2 Q 43 2 43 4 L 43 28 Q 43 30 41 30 L 38 30 Q 36.5 30 35.5 28.8 L 28.5 14.5 L 28.5 28 Q 28.5 30 26.5 30 L 25 30 Q 23 30 23 28 Z" fill="#f5f4f0" />
  </g>

  <!-- Modern Accent Dot -->
  <circle cx="51" cy="45" r="3.5" fill="url(#brandGrad)" />
</svg>
